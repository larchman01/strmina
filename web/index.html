<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a33">
  <title>Strmina – Krvavec</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="readout" hidden>
    <div class="big"><span id="ro-slope">–</span>°</div>
    <div class="small"><span id="ro-aspect">–</span> · <span id="ro-elev">–</span> m</div>
    <div class="label" id="ro-label">izbrana točka</div>
  </div>

  <section id="panel">
    <button id="panel-toggle" aria-expanded="true">Strmina <span class="chev">▾</span></button>
    <div id="panel-body">
      <div class="legend" id="legend"></div>

      <label class="row">
        <span>Prosojnost naklonov</span>
        <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.6">
      </label>

      <div class="row toggles">
        <label><input type="checkbox" id="t-slope" checked> Nakloni</label>
        <label><input type="checkbox" id="t-hillshade" checked> Senčenje</label>
        <label><input type="checkbox" id="t-3d"> 3D</label>
      </div>

      <div class="row toggles">
        <span>Podlaga</span>
        <label><input type="radio" name="base" value="topo" checked> Topo</label>
        <label><input type="radio" name="base" value="osm"> OSM</label>
        <label><input type="radio" name="base" value="none"> Brez</label>
      </div>

      <p class="note">
        Tapni karto za naklon, ekspozicijo in višino. Naklon je izračunan iz LiDAR DMR (0,5 m),
        zglajenega na ~5 m. Teren je posnet brez snega. <strong>Naklon ni ocena plazovne nevarnosti</strong> –
        preveri <a href="https://meteo.arso.gov.si/met/sl/avalanche/" target="_blank" rel="noopener">plazovni bilten</a>.
      </p>
      <p class="attrib">Vir: GURS, CLSS 2023–2025 (CC BY 4.0).</p>
    </div>
  </section>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
